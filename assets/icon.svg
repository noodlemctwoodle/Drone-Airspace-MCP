<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Airspace Radar Rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-width="8" stroke-dasharray="24 12"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="#1e293b" stroke-width="12"/>
  
  <!-- Geometric Quadcopter -->
  <g stroke="url(#accent)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none">
     <!-- Drone Arms -->
     <line x1="160" y1="160" x2="352" y2="352" />
     <line x1="352" y1="160" x2="160" y2="352" />
     
     <!-- Center Chassis -->
     <rect x="216" y="216" width="80" height="80" rx="20" fill="#0f172a" stroke="url(#accent)" stroke-width="16" />
     
     <!-- Propellers -->
     <circle cx="160" cy="160" r="44" stroke-width="16"/>
     <circle cx="352" cy="160" r="44" stroke-width="16"/>
     <circle cx="160" cy="352" r="44" stroke-width="16"/>
     <circle cx="352" cy="352" r="44" stroke-width="16"/>
  </g>
  
  <!-- Center Location/Signal Dot -->
  <circle cx="256" cy="256" r="14" fill="#38bdf8"/>
</svg>
