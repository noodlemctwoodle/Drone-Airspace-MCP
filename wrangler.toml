name = "fpv-airspace"
main = "src/worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Custom domain (DNS and certificate are managed by Cloudflare).
[[routes]]
pattern = "fpv-airspace.fetchlabs.co.uk"
custom_domain = true

[define]
__PKG_VERSION__ = "\"0.1.5\""

[vars]
LOG_LEVEL = "info"
NOTAM_CACHE_TTL_SECONDS = "1800"
PUBLIC_URL = "https://fpv-airspace.fetchlabs.co.uk"
# Donation link shown in the map credits: GitHub Sponsors, or a Stripe Payment Link once created. Empty hides it.
SUPPORT_URL = "https://donate.stripe.com/3cI28sesu6T0f4n7IP2Nq00"
SUPPORT_MONTHLY_URL = "https://donate.stripe.com/8x2bJ23NQcdke0j3sz2Nq01"
# Embedded checkout on the map. STRIPE_SECRET_KEY is a secret: `wrangler secret put STRIPE_SECRET_KEY`. Without it the Donate
# button opens the Payment Links above instead.
STRIPE_PUBLISHABLE_KEY = "pk_live_51UJvGQLuAdK4E4Q2ZHxqhVQ2eZZDlZcML9s8L2EhCqZkHSWeCulvyfaty8cuIvHtQ5gPYmF2GlChmLLQQvlWcVca00sI8K6Twf"
STRIPE_PRICE_ONCE = "price_1UJvboLuAdK4E4Q24yMrQ6xb"
STRIPE_PRICE_MONTHLY = "price_1UJviTLuAdK4E4Q2bKc1LnHK"
# OS_NAMES_API_KEY is a secret: `wrangler secret put OS_NAMES_API_KEY`
# Optional overrides with defaults in src/core/config.ts: OPEN_METEO_URL, OPEN_METEO_ELEVATION_URL,
# NOAA_KP_URL, WEATHER_CACHE_TTL_SECONDS, ELEVATION_CACHE_TTL_SECONDS, SPACE_WEATHER_CACHE_TTL_SECONDS

[[d1_databases]]
binding = "DB"
database_name = "uk-drone-airspace"
database_id = "1b51c283-60fc-4c89-9c33-182b9b72933e"

[[kv_namespaces]]
binding = "CACHE"
id = "3ef6187b2ff8401a8322a0f17be731d0"

[observability]
enabled = true
