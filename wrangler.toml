name = "uk-drone-airspace-mcp"
main = "src/worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[define]
__PKG_VERSION__ = "\"0.1.5\""

[vars]
LOG_LEVEL = "info"
NOTAM_CACHE_TTL_SECONDS = "1800"
PUBLIC_URL = "https://uk-drone-airspace-mcp.toby-74b.workers.dev"
# OS_NAMES_API_KEY is a secret: `wrangler secret put OS_NAMES_API_KEY`

[[d1_databases]]
binding = "DB"
database_name = "uk-drone-airspace"
database_id = "1b51c283-60fc-4c89-9c33-182b9b72933e"

[[kv_namespaces]]
binding = "CACHE"
id = "3ef6187b2ff8401a8322a0f17be731d0"

[observability]
enabled = true
