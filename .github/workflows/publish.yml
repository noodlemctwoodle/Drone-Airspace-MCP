name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer; Node 22 ships an older npm.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify build output
        run: test -f dist/index.js && node dist/index.js --version
      - name: Skip if this version is already on npm
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "uk-drone-airspace-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "already published $VERSION"; echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      # Authenticates via the trusted publisher configured on npmjs.com (OIDC, no token).
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public --ignore-scripts

  desktop-extension:
    # Independent of the npm job so the bundle is attached even when npm is skipped.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Production dependencies only
        run: npm prune --omit=dev
      - name: Sync manifest version with package.json
        run: node -e "const fs=require('fs');const m=require('./manifest.json');m.version=require('./package.json').version;fs.writeFileSync('manifest.json',JSON.stringify(m,null,2)+'\n')"
      - name: Pack .mcpb
        run: npx --yes @anthropic-ai/mcpb pack . uk-drone-airspace.mcpb
      - name: Attach to a GitHub release (never marked latest; pack releases own "latest")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          make_latest: false
          files: uk-drone-airspace.mcpb
