name: Build data pack

on:
  schedule:
    # Daily; AIRAC changes at 00:00 UTC every 28 days, rowmaps refreshes on Fridays.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build even if nothing upstream changed
        type: boolean
        default: false
      region:
        description: Region to build (national, south-west, wales)
        type: string
        default: national
      strict:
        description: Fail the build on cross-check warnings
        type: boolean
        default: false

concurrency:
  group: build-pack
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      airac_date: ${{ steps.check.outputs.airac_date }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - id: check
        run: npx tsx scripts/check-upstream.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true' || inputs.force == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Restore upstream download cache
        uses: actions/cache@v4
        with:
          path: build/raw
          key: pack-raw-${{ github.run_id }}
          restore-keys: |
            pack-raw-
      - name: Build pack
        id: build
        run: |
          TAG="pack-${{ needs.check.outputs.airac_date }}-${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          npx tsx scripts/build-pack.ts --region "${{ inputs.region || 'national' }}" --tag "$TAG" ${{ inputs.strict == true && '--strict' || '' }}
      - name: Attribution file
        run: |
          node -e '
            const m = require("./build/manifest.json");
            const lines = ["# Attribution", "", `Pack ${m.tag} built ${m.built_at} (region ${m.region}).`, ""];
            for (const s of m.sources) lines.push(`- **${s.name}** (${s.licence}): ${s.attribution}`);
            require("fs").writeFileSync("build/ATTRIBUTION.md", lines.join("\n") + "\n");
          '
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.tag }}
          name: Data pack ${{ steps.build.outputs.tag }}
          body: |
            Region: ${{ inputs.region || 'national' }}
            Reason: ${{ needs.check.outputs.reason || 'manual' }}

            Download is automatic: the server fetches `manifest.json` from the latest release.
          make_latest: true
          files: |
            build/pack/*.sqlite.gz
            build/manifest.json
            build/ATTRIBUTION.md
            build/reports/*.json
      - name: Load the pack into Cloudflare D1
        if: ${{ vars.CLOUDFLARE_DEPLOY == 'true' }}
        run: |
          npx tsx scripts/export-d1.ts build/pack/*.sqlite --out build/d1.sql
          npx wrangler d1 execute uk-drone-airspace --remote --yes --file build/d1.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Prune old pack releases
        run: npx tsx scripts/prune-releases.ts --keep 6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Data pack build failed';
            const body = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nReason for build: ${{ toJSON(needs.check.outputs.reason) }}`;
            const { data: issues } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'pack-build-failed' });
            if (issues.length === 0) {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['pack-build-failed', 'automated'] });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issues[0].number, body });
            }
