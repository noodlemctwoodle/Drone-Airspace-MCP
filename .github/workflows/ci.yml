name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the CLI
        run: |
          node dist/index.js --version
          node dist/index.js --help | head -3
      - name: Verify package contents
        run: npm pack --dry-run 2>&1 | tee pack.txt && grep -q "dist/index.js" pack.txt && ! grep -q "pipeline/" pack.txt
